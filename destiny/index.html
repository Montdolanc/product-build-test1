function validSolarDate(year,month,day){const dt=new Date(Date.UTC(year,month-1,day));return dt.getUTCFullYear()===year&&dt.getUTCMonth()===month-1&&dt.getUTCDate()===day;}
function calcSaju(){
 if(!calcReady())throw new Error('기본 달력 계산 모듈을 불러오지 못했습니다.');
 const [year,month,day]=form.birth.split('-').map(Number);
 if(!Number.isInteger(year)||year<1900||year>Number(todayKST().slice(0,4)))throw new Error('지원 연도는 1900년부터 현재까지입니다.');
 KoreanCalendarCore.isoDate(year,month,day);
 const [hour,minute]=form.timeKnown==='known'?form.time.split(':').map(Number):[12,0];
 if(!Number.isInteger(hour)||hour<0||hour>23||!Number.isInteger(minute)||minute<0||minute>59)throw new Error('출생시각은 00:00~23:59로 입력해 주세요.');
 const actual=form.calendar==='solar'?form.birth:KoreanCalendarCore.lunarToSolar(year,month,day,form.leap);
 if(actual< '1900-01-01'||actual>todayKST())throw new Error('지원하는 출생 날짜는 1900년 1월 1일부터 오늘까지입니다.');
 const dayPillar=KoreanCalendarCore.dayPillar(actual);
 let pillars={year:null,month:null,day:dayPillar,hour:null}, mode='day-only';
 let warning='절기 기반 4주 계산을 준비하고 있습니다.';
 if(!calcFullReady())throw new Error('절기 기반 사주 계산 모듈을 불러오지 못했습니다. 페이지를 다시 열어주세요.');
 const computed=KoreanSajuPillars.compute({solarDate:actual,timeKnown:form.timeKnown==='known',time:form.time});
 if(computed.day!==dayPillar)throw new Error('일주 계산 기준이 서로 일치하지 않습니다. 계산을 중단했습니다.');
 pillars={year:computed.year,month:computed.month,day:computed.day,hour:computed.hour};
 mode='full';
 warning='1900년 이후 천문 절기 및 Asia/Seoul 역사적 시차를 적용한 4주 계산입니다. 00:00 일주 변경 기준이며 진태양시 보정은 적용하지 않습니다. '+computed.warnings.join(' ');
 const dayStem=pillars.day[0];
 const g=guardians.find(x=>x.stem===dayStem);
 if(!g)throw new Error('해당 일간의 수호신을 찾지 못했습니다.');
 const counts={목:0,화:0,토:0,금:0,수:0};
 Object.values(pillars).filter(Boolean).forEach(p=>{if(stemElement[p[0]])counts[stemElement[p[0]]]++;if(branchElement[p[1]])counts[branchElement[p[1]]]++;});
 const total=Object.values(counts).reduce((a,b)=>a+b,0);
 return {pillars,dayStem,guardian:g,solarDate:actual,counts,total,timeKnown:form.timeKnown==='known',calendar:form.calendar,mode,warning,ruleVersion:DestinyFortune.VERSION};
}

 <div class="period-list">${currentMonth.segments.map((seg,i)=>`<div class="period-item"><div><strong>${seg.yearPillar}년 · ${seg.monthPillar}월</strong><span>${seg.term} 이후 적용 구간 · ${seg.tenGod}</span></div><small>${formatMoment(seg.from)}부터<br>${formatMoment(seg.until)} 전까지</small><p>${seg.description}.</p></div>`).join('')}</div>
 <p style="color:#b9c4d7;font-size:12px;line-height:1.6">${currentMonth.disclaimer}</p></div>
 <p class="note" style="margin-top:22px">${userNote()}<br>${annual.disclaimer}<br>절입 시각은 한국천문연구원에서 발표한 분 단위 값에 맞췄습니다. 초 단위 경계, 일주 경계·한국 지역별 역사 시차는 추가 검증 대상입니다.</p>
 <div class="actions"><button class="btn btn-primary" data-go="share">나의 수호신 카드 저장 →</button><button class="btn btn-ghost" data-go="guardian">캐릭터 다시 보기</button></div></div>`;
}

function sharePage(){return `<div class="section fade share-layout"><div class="stephead"><strong>수호신 카드 보관함</strong><span>SHARE / SAVE</span></div><div class="share-card" id="capture-card"><p class="kicker">DESTINY GARDEN · 2027</p><img class="main-icon" alt="${guardian.name}" src="${guardian.art}"/><div class="kicker">${guardian.element}</div><h2 class="title-serif">${guardian.name}</h2><p style="color:#d9d7eb">${guardian.tags.join(' · ')}</p><div class="divider"></div><p style="color:#f4dca6;font-size:16px">${!isDemo&&saju?DestinyFortune.annual(saju).title:guardian.fortune}</p><p class="muted" style="font-size:11px">${isDemo?'디자인 샘플 카드':'사주 일간 기반 수호신 카드'} · 성향과 운세 문구는 창작 설정</p></div><div class="actions"><button class="btn btn-primary" id="download-card">⬇ 캐릭터 PNG 저장</button><button class="btn btn-dark" id="copy-card">⧉ 결과 텍스트 복사</button><button class="btn btn-ghost" id="copy-share-link">🔗 수호신 링크 복사</button><button class="btn btn-ghost" id="native-share">↗ 공유하기</button></div><p class="note" id="share-feedback" role="status" aria-live="polite" style="margin-top:18px">이 버전은 결과 이미지와 개인정보 없는 캐릭터 공개 링크를 공유할 수 있습니다. 링크는 수호신 종류만 포함하며 생년월일·출생시간·사주팔자는 넣지 않습니다. 링크는 공개 도메인에 배포한 후 사용하세요.</p><button class="btn btn-ghost block" data-go="home" style="margin-top:18px">처음으로 돌아가기</button></div>`;}

function codexCards(limit=false){return `<div class="codex-grid">${(limit?guardians.slice(0,5):guardians).map((g,i)=>`<button type="button" class="codex-item" data-detail="${i}" title="${g.name} 소개 보기"><span class="kicker">${g.stem}</span><img src="${g.art}" alt="${g.name}" /><b>${g.name}</b><small>${g.element} · ${g.tags[0]}</small></button>`).join('')}</div>`;}

function codexPage(){const g=guardians[detail];return `<section class="section fade"><div class="section-head"><p class="kicker">GUARDIAN CODEX</p><h2>열 가지 운명의 수호신</h2><p class="muted">전통 천간을 모티브로 창작한 판타지 캐릭터 도감</p></div>${codexCards()}<article class="info-box" style="margin-top:24px;display:flex;align-items:center;gap:24px"><img class="codex-detail-image" src="${g.art}" alt="${g.name}"><div><div class="kicker">${g.stem} · ${g.element}</div><h2 style="margin:8px 0">${g.name}</h2><p>${g.story}</p></div></article><div class="actions"><button class="btn btn-primary" data-go="start">나의 수호신 소환해 보기</button><button class="btn btn-ghost" data-go="home">메인으로</button></div></section>`;}

function render(){const pages={home,start,summon,guardian:guardianPage,fortune:fortunePage,share:sharePage,codex:codexPage};app.innerHTML=pages[screen]();document.title=(screen==='home'?'2027 운명의 정원':({start:'생년월일 입력',summon:'수호신 소환',guardian:'수호신 결과',fortune:'2027 신년운세',share:'카드 저장',codex:'수호신 도감'}[screen]))+' | Destiny Garden';wire();}
function wire(){app.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));app.querySelectorAll('[data-detail]').forEach(b=>b.addEventListener('click',()=>{detail=Number(b.dataset.detail);go('codex');}));app.querySelectorAll('[data-month]').forEach(b=>b.addEventListener('click',()=>{month=Number(b.dataset.month);render();document.querySelector('.month-grid').scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});}));if(screen==='start'){const f=document.getElementById('birth-form');f.addEventListener('change',e=>{const b=document.getElementById('birth-date');if(b)form.birth=b.value;const t=document.getElementById('birth-time');if(t)form.time=t.value;if(e.target.name==='cal'){form.calendar=e.target.value;render();}if(e.target.name==='known'){form.timeKnown=e.target.value;render();}if(e.target.name==='leap'){form.leap=e.target.checked;}});f.addEventListener('submit',e=>{e.preventDefault();form.birth=document.getElementById('birth-date').value;const bt=document.getElementById('birth-time');if(bt)form.time=bt.value;const err=document.getElementById('form-error');err.textContent='';try{saju=calcSaju();guardian=saju.guardian;isDemo=false;go('summon');summonTimer=setTimeout(()=>{if(screen==='summon')go('guardian');},1900);}catch(ex){err.textContent=ex.message||'만세력 계산에 실패했습니다.';}});document.getElementById('sample-btn').addEventListener('click',()=>{isDemo=true;saju=null;guardian=guardians[7];go('summon');summonTimer=setTimeout(()=>{if(screen==='summon')go('guardian');},1900);});}if(screen==='summon')document.getElementById('skip-btn').addEventListener('click',()=>go('guardian'));if(screen==='share'){document.getElementById('download-card').addEventListener('click',downloadCard);document.getElementById('copy-card').addEventListener('click',copyCard);document.getElementById('copy-share-link').addEventListener('click',copyPublicLink);document.getElementById('native-share').addEventListener('click',nativeShare);}}
async function downloadCard(){const c=document.createElement('canvas');c.width=1080;c.height=1350;const x=c.getContext('2d');const grad=x.createLinearGradient(0,0,1080,1350);grad.addColorStop(0,'#111b30');grad.addColorStop(.48,'#3a2b5c');grad.addColorStop(1,'#121d34');x.fillStyle=grad;x.fillRect(0,0,1080,1350);x.strokeStyle='#d9bc7b';x.lineWidth=5;x.strokeRect(50,50,980,1250);x.strokeStyle='#e8c98c88';x.lineWidth=2;x.strokeRect(68,68,944,1214);let seed=7;function rand(){seed=(seed*16807)%2147483647;return seed/2147483647;}for(let i=0;i<75;i++){let px=80+rand()*920,py=90+rand()*1150;x.fillStyle=i%4===0?'#f5d39e':'#b9c5ec';x.globalAlpha=.25+rand()*.6;x.beginPath();x.arc(px,py,1+rand()*3,0,Math.PI*2);x.fill();}x.globalAlpha=1;x.textAlign='center';x.fillStyle='#f4dcaa';x.font='bold 38px sans-serif';x.fillText('DESTINY GARDEN · 2027',540,155);
 try{const img=new Image();img.src=guardian.art;await img.decode();const target={x:260,y:238,w:560,h:675};x.drawImage(img,target.x,target.y,target.w,target.h);x.strokeStyle='#e9c786';x.lineWidth=4;x.strokeRect(target.x,target.y,target.w,target.h);}catch(e){x.font='230px sans-serif';x.fillText(guardian.emoji,540,620);}
 x.font='bold 37px sans-serif';x.fillStyle='#dec890';x.fillText(guardian.element,540,970);x.font='bold 75px "Malgun Gothic",sans-serif';x.fillStyle='#fff1d3';x.fillText(guardian.name,540,1055);x.font='28px "Malgun Gothic",sans-serif';x.fillStyle='#d7dbea';x.fillText(guardian.tags.join('  ·  '),540,1110);x.font='25px "Malgun Gothic",sans-serif';x.fillStyle='#e8cca0';x.fillText(isDemo?'디자인 샘플 카드':'일간 기반 수호신 캐릭터',540,1177);x.font='21px "Malgun Gothic",sans-serif';x.fillStyle='#c5bfd3';x.fillText('캐릭터 성향과 운세 문구는 창작 오락 콘텐츠',540,1245);c.toBlob(blob=>{if(!blob){document.getElementById('share-feedback').textContent='이미지 생성에 실패했습니다.';return;}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='destiny-garden-'+guardian.id+'-2027.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);document.getElementById('share-feedback').textContent='카드 PNG 저장을 시작했습니다. 다운로드 폴더를 확인해 주세요.';},'image/png');}

function publicCardURL(){return new URL('share/'+guardian.id+'.html',window.location.href).href;}
async function copyPublicLink(){const el=document.getElementById('share-feedback');if(location.protocol==='file:'){el.textContent='로컬 파일은 다른 사람에게 공유할 수 없습니다. 웹사이트를 HTTPS로 배포한 뒤 링크를 복사하세요.';return;}const url=publicCardURL();try{await navigator.clipboard.writeText(url);el.textContent='공개용 수호신 링크를 복사했습니다. 생년월일·출생시간은 포함되지 않습니다.';}catch(e){const t=document.createElement('textarea');t.value=url;document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();el.textContent=ok?'공개용 수호신 링크를 복사했습니다.':'브라우저에서 링크 복사가 지원되지 않습니다.';}}
async function nativeShare(){const el=document.getElementById('share-feedback');if(location.protocol==='file:'){el.textContent='공유는 홈페이지를 HTTPS로 배포한 뒤 이용할 수 있습니다.';return;}const url=publicCardURL();try{if(navigator.share){await navigator.share({title:'나의 2027 수호신 · '+guardian.name,text:'2027 운명의 정원에서 만난 나의 수호신: '+guardian.name,url});el.textContent='공유 창을 열었습니다.';}else{await copyPublicLink();}}catch(e){if(e.name!=='AbortError')el.textContent='공유에 실패했습니다. 링크 복사를 이용해 주세요.';}}

async function copyCard(){const s=`2027 운명의 정원 ✦ 나의 수호신은 ${guardian.name} (${guardian.element})\n${guardian.tags.join(' · ')}\n${!isDemo&&saju?DestinyFortune.annual(saju).title:guardian.fortune}\n※ 기본 캐릭터는 계산된 일간 기준(샘플 모드 제외), 운세는 창작 오락 콘텐츠입니다.`;try{await navigator.clipboard.writeText(s);document.getElementById('share-feedback').textContent='결과 텍스트를 복사했습니다.';}catch(e){const t=document.createElement('textarea');t.value=s;t.style.cssText='position:fixed;left:-9999px';document.body.appendChild(t);t.select();let ok=document.execCommand('copy');t.remove();document.getElementById('share-feedback').textContent=ok?'결과 텍스트를 복사했습니다.':'브라우저에서 자동 복사를 지원하지 않습니다.';}}
document.getElementById('brand-btn').addEventListener('click',()=>go('home'));document.getElementById('home-nav').addEventListener('click',()=>go('home'));document.getElementById('codex-nav').addEventListener('click',()=>go('codex'));render();
</script>
</body>
</html>
