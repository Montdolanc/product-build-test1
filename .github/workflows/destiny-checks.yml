name: Destiny Garden checks

on:
  pull_request:
    paths:
      - "destiny/**"
      - "index.html"
      - "404.html"
      - "styles.css"
      - ".github/workflows/destiny-checks.yml"
  push:
    branches: [main]
    paths:
      - "destiny/**"
      - "index.html"
      - "404.html"
      - "styles.css"
      - ".github/workflows/destiny-checks.yml"

permissions:
  contents: read

jobs:
  saju-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Show Node version
        run: node --version
      - name: Four-pillar, lunar and Ipchun regression
        run: node destiny/tests/pillars.test.js
      - name: Historical Korean time and DST regressions
        run: node destiny/tests/historical-time.test.js
      - name: Ten-god and missing-pillar explanation regressions
        run: node destiny/tests/insights.test.js
      - name: Korean-only output and public cards
        run: node destiny/tests/plain-korean.test.js
      - name: Navigation and site-links smoke test
        run: node destiny/tests/navigation.test.js
